<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Ahmed Mujtaba</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0a192f" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--navy);
      color: var(--white);
      padding: 40px 24px;
    }
    .nf-code {
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      letter-spacing: -0.04em;
    }
    .nf-wrap h1 {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 700;
      margin: 14px 0 10px;
    }
    .nf-wrap p {
      color: var(--slate-400);
      max-width: 440px;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <p class="nf-code">404</p>
    <h1>This page doesn&rsquo;t exist</h1>
    <p>The page you were looking for may have been moved or renamed. Everything lives on the main page.</p>
    <a class="btn btn-primary" href="/">Back to homepage</a>
  </main>
</body>
</html>
